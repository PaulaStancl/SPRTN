# R environment for the 01/02 mutation analysis scripts (not the pipelines, which
# run in containers). Create next to the other envs:
#   micromamba create -y -p /common/WORK/pstancl/envs/r-mutation -f env_r_mutation.yml
#   micromamba activate /common/WORK/pstancl/envs/r-mutation
# qcVCF (private GitHub repo) is installed afterwards with remotes, using a GitHub
# token in ~/.Renviron (GITHUB_PAT=...):  remotes::install_github("PaulaStancl/qcVCF")
name: r-mutation
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.3
  - r-data.table
  - r-ggplot2
  - r-cowplot            # qcVCF dependency
  - r-stringr            # qcVCF dependency (plot96_matrix, within_subject mode)
  - r-stringi            # qcVCF dependency (plot96_matrix)
  - r-ggtext             # qcVCF dependency (plot96_matrix), not declared by qcVCF
  - samtools             # faidx: SNV trinucleotide context for the 96-context plots
  - r-remotes            # to install qcVCF from GitHub
